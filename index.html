<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Crush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden; /* Prevents scrollbars when button moves */
            position: relative;
            padding: 20px;
        }

        .container {
            max-width: 90%;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 40px;
        }

        .gif-container img {
            max-width: 250px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        /* Standard Flexbox keeps buttons separated and side-by-side initially */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px; 
            width: 100%;
            height: 60px; /* Reserves space so layout doesn't collapse */
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        /* No button starts as a normal element side-by-side with Yes */
        #noBtn {
            background-color: #6c757d;
            color: white;
            transition: all 0.15s ease;
            touch-action: none; /* Crucial for mobile touch tracking */
        }
    </style>
</head>
<body>

    <div class="container" id="questionContainer">
        <div class="gif-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZmhjYjNoYnducDl4bDlqNWJyNXQwM2JnbnYzY2RwYmljaW9sNGM3MCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/26FLdmIp6wJr91JAI/giphy.gif" alt="Cute cute">
        </div>
        <h1>Hi ညီမ, အစ်ကို့ ကိုချစ်လား?</h1>
        <p>Please say yes... 🥺</p>
        
        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const container = document.getElementById('questionContainer');

        function moveNoButton() {
            // Calculate random screen position safely
            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            // Instantly break out of the flexbox layout container on first touch/hover
            noBtn.style.position = 'fixed';
            
            // Set the new coordinates
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Triggers instantly on mobile screen touch
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveNoButton();
        });

        // Triggers on desktop hover
        noBtn.addEventListener('mouseover', moveNoButton);

        // Success state
        yesBtn.addEventListener('click', () => {
            container.innerHTML = `
                <div class="gif-container">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZWpoNjcwYng1eDFncTB6dzF4NHR5ejN3cGY4ejNtYjFhZW84dHNkbCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/dtGIRL0FDp6nnOPGb5/giphy.gif" alt="Happy">
                </div>
                <h1 style="color: #ff4d6d;">Yayyyyy! I knew it! ❤️ 🥰</h1>
                <p>See you on our first date!</p>
            `;
            if(document.body.contains(noBtn)) {
                noBtn.remove();
            }
        });
    </script>
</body>
</html>
